name: 🐛 Bug Report
description: Report a bug or unintended behavior
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please fill out the form as completely as possible.
        
  - type: markdown
    attributes:
      value: |
        ⚠️ For general questions or setup help, please use our Discord:
        https://discord.gg/YOUR_INVITE

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      description: Version of the Randomizer mod
      placeholder: "e.g. 0.5.0"
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      placeholder: "e.g. 1.21.1"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - NeoForge
        - Forge
        - Fabric (if applicable)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the bug be reproduced?
      placeholder: |
        1. Start server
        2. Trigger random event
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash report
      description: Please paste relevant logs or crash reports
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am using the latest mod version
          required: true
        - label: I searched existing issues before opening this report
          required: true
