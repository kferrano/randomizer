name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Feature suggestions are welcome.
        Please keep requests focused and well explained.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your idea or feature in detail
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other solutions?

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Low (minor improvement)
        - Medium (new gameplay option)
        - High (major system change)

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This feature fits the Randomizer concept
          required: true
        - label: I checked existing issues and roadmap
          required: true
