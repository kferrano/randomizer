name: ⚙️ Config / Balance Issue
description: Report balance problems or config-related issues
title: "[Config]: "
labels: ["config", "balance"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template for balance problems, tier issues, spawn rates,
        or unexpected behavior caused by configuration values.

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: "e.g. 0.5.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config settings
      description: Paste the relevant parts of your config
      render: toml
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Description
      description: What feels wrong or unbalanced?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What would you expect instead?

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Minor annoyance
        - Gameplay impacting
        - Server-breaking
