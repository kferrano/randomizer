name: ❓ Question / Support
description: Ask a question about usage or configuration
title: "[Question]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Support & Questions**
        
        For general questions, setup help, or balance discussions,
        please join our Discord server:
        
        👉 **https://discord.gg/YOUR_INVITE**
        
        GitHub issues should mainly be used for bugs and feature tracking.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: If this is not suitable for Discord, ask your question here.
    validations:
      required: true
